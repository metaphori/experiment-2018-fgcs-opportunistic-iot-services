variables:
  moveFrequency: &moveFrequency
    formula: 1/60

environment:
  type: OSMEnvironment
  parameters: ["/vcm.pbf", false]

incarnation: protelis
network-model:
  type: EuclideanDistance
  parameters: [100]

ReproduceGPSTrace: &ReproduceGPSTrace
  type: ReproduceGPSTrace
  parameters: ["/vcmuser.gpx", false, AlignToTime, 1365922800, false, false]

pools:
  - pool: &moveWithTraces
    - time-distribution: *moveFrequency
      type: Event
      actions:
        - *ReproduceGPSTrace
  - pool: &move
    - time-distribution: 0.1
      type: Event
      conditions:
        - type: MoleculeHasConcentration
          parameters: [crowd, false]
      actions:
        - *ReproduceGPSTrace
    - time-distribution: 0.1
      type: Event
      conditions:
        - type: MoleculeHasConcentration
          parameters: [crowd, true]
      actions:
        - type: TargetWalker
          parameters: [goto, none]
  - pool: &crowd
    - time-distribution: 1
      program: crowd
    - program: send

displacements:
  - in:
      type: FromGPSTrace
      parameters: [1497, "/vcmuser.gpx", false, AlignToTime, 1365922800, false, false]
    programs:
      - *move
      - *crowd
    contents:
      - molecule: human
        concentration: true
  - in:
      type: Rectangle
      parameters: [1000, 48.17, 16.3, 0.07, 0.15]
    programs:
      - *crowd
    contents:
      
        
        
        